<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard – Zeta Psi Clemson</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: var(--off-white); }

    .portal-header {
      background: linear-gradient(135deg, var(--navy-dark), var(--navy));
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .portal-header .brand {
      color: var(--gold);
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      font-family: sans-serif;
      letter-spacing: 0.04em;
    }

    .portal-header .user-info {
      color: rgba(255,255,255,0.85);
      font-family: sans-serif;
      font-size: 0.88rem;
    }

    .portal-header .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .portal-header .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.85);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.83rem;
      font-family: sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }

    .portal-header .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    .dashboard-body {
      max-width: 1050px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .welcome-msg {
      margin-bottom: 1.5rem;
    }

    .welcome-msg h2 { color: var(--navy); font-size: 1.5rem; }
    .welcome-msg p  { color: var(--text-medium); font-size: 0.9rem; font-family: sans-serif; }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      border-top: 4px solid var(--gold);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-card .sc-label {
      font-family: sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gray-mid);
    }

    .stat-card .sc-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--navy);
      line-height: 1.1;
    }

    .stat-card .sc-sub {
      font-family: sans-serif;
      font-size: 0.78rem;
      color: var(--text-medium);
    }

    .stat-card.dues-paid   { border-top-color: #2e7d32; }
    .stat-card.dues-unpaid { border-top-color: #c62828; }

    .dues-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-family: sans-serif;
      font-weight: 700;
    }

    .dues-badge.paid   { background: #e8f5e9; color: #2e7d32; }
    .dues-badge.unpaid { background: #ffeaea; color: #c62828; }

    /* Content grid */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      background: var(--navy);
      padding: 0.85rem 1.25rem;
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: bold;
      font-family: sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .panel-body { padding: 1.25rem; }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--gray-light);
      font-size: 0.88rem;
      gap: 0.5rem;
    }

    .item-row:last-child { border-bottom: none; }

    .item-row .item-name { color: var(--text-dark); font-weight: 600; }
    .item-row .item-date { color: var(--gray-mid); font-family: sans-serif; font-size: 0.78rem; white-space: nowrap; }
    .item-row .item-tag  { font-size: 0.72rem; }

    .empty-state {
      text-align: center;
      color: var(--gray-mid);
      font-family: sans-serif;
      font-size: 0.88rem;
      padding: 1.5rem 0;
    }

    /* Dues table */
    .dues-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .dues-table td { padding: 0.5rem 0; border-bottom: 1px solid var(--gray-light); }
    .dues-table td:first-child { color: var(--text-dark); font-weight: 600; }
    .dues-table td:last-child  { text-align: right; }
    .dues-table tr:last-child td { border-bottom: none; }

    #loading-screen {
      position: fixed; inset: 0; background: var(--navy);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }

    #loading-screen .spin {
      font-size: 3rem; animation: spin 1.5s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-screen"><span class="spin">ΖΨ</span></div>

<!-- Portal header -->
<header class="portal-header">
  <a href="index.html" class="brand">ΖΨ Zeta Psi · Clemson</a>
  <span class="user-info" id="user-info-text">Loading…</span>
  <div class="header-actions">
    <a href="index.html" class="btn-outline">Chapter Home</a>
    <button class="btn-outline" onclick="doSignOut()">Sign Out</button>
  </div>
</header>

<!-- Dashboard body -->
<main class="dashboard-body" id="dashboard-body" style="display:none;">
  <div class="welcome-msg">
    <h2 id="welcome-name">Welcome back!</h2>
    <p id="welcome-sub"></p>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card">
      <span class="sc-label">Events Attended</span>
      <span class="sc-value" id="stat-events">—</span>
      <span class="sc-sub">Total events</span>
    </div>
    <div class="stat-card">
      <span class="sc-label">Service Hours</span>
      <span class="sc-value" id="stat-hours">—</span>
      <span class="sc-sub">Philanthropy &amp; service</span>
    </div>
    <div class="stat-card">
      <span class="sc-label">Chapters Attended</span>
      <span class="sc-value" id="stat-chapters">—</span>
      <span class="sc-sub">Chapter meetings</span>
    </div>
    <div class="stat-card" id="stat-dues-card">
      <span class="sc-label">Dues Status</span>
      <span class="sc-value" id="stat-dues-value" style="font-size:1.1rem;margin-top:0.2rem;">—</span>
      <span class="sc-sub" id="stat-dues-sub"></span>
    </div>
  </div>

  <!-- Content panels -->
  <div class="content-grid">
    <!-- Upcoming Events -->
    <div class="panel">
      <div class="panel-header">Upcoming Events</div>
      <div class="panel-body" id="upcoming-events-list">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

    <!-- My Recent Attendance -->
    <div class="panel">
      <div class="panel-header">My Recent Attendance</div>
      <div class="panel-body" id="recent-attendance-list">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

    <!-- Dues Details -->
    <div class="panel">
      <div class="panel-header">Dues Details</div>
      <div class="panel-body" id="dues-detail">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

    <!-- My Profile -->
    <div class="panel">
      <div class="panel-header">My Profile</div>
      <div class="panel-body" id="profile-panel">
        <div class="empty-state">Loading…</div>
      </div>
    </div>
  </div>
</main>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
